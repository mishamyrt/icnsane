[package]
name = "icnsane"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/mishamyrt/icnsane"
homepage = "https://github.com/mishamyrt/icnsane"
description = "Apply custom macOS application icons from a TOML file"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSColor", "NSColorSpace", "NSImageRep", "objc2-core-foundation"] }
